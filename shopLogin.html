<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalLink – Shop Login</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background: #f0f4f8;
        font-family: "Segoe UI", sans-serif;
      }
      .auth-page {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      .auth-wrapper {
        max-width: 950px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        border-radius: 16px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1fr;
        animation: fadeIn 0.3s ease;
      }
      .auth-illustration {
        background: #e8eff5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .auth-illustration img {
        width: 100%;
        height: 100%;
        max-height: 520px;
        object-fit: cover;
        border-radius: 12px;
      }
      .auth-form {
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .auth-form h2 {
        margin-bottom: 0.5rem;
        color: #0b2545;
      }
      .auth-form p {
        color: #617d98;
        margin-bottom: 1.5rem;
      }
      .auth-form input {
        padding: 0.8rem 1rem;
        margin-bottom: 0.85rem;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #f9fafb;
        font-size: 1rem;
        width: 100%;
        transition: 0.25s;
      }
      .auth-form input:focus {
        border-color: #0b2545;
        background: #fff;
        outline: none;
      }
      .auth-form .btn {
        background: #fcca46;
        color: #0b2545;
        font-weight: 600;
        border: none;
        padding: 0.9rem;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.25s;
      }
      .auth-form .btn:hover {
        background: #ffb703;
      }
      .error {
        display: none;
        color: red;
        font-size: 0.85rem;
        margin: -0.4rem 0 0.6rem;
        text-align: left;
      }
      @media (max-width: 820px) {
        .auth-wrapper {
          grid-template-columns: 1fr;
        }
        .auth-illustration {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="container">
        <h1 class="logo">LocalLink</h1>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="explore.html">Explore</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="signup.html">Sign Up</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-wrapper">
        <div class="auth-illustration">
          <img
            src="https://plus.unsplash.com/premium_vector-1683141009559-f7ec8d07119e?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Shop Login Illustration"
          />
        </div>

        <div class="auth-form">
          <h2>Shopkeeper Login</h2>
          <p>Access your LocalLink shop dashboard</p>
          <form id="shopLoginForm">
            <input
              type="email"
              id="shopLoginEmail"
              placeholder="Email"
              required
            />
            <span class="error" id="shopLoginEmailError"
              >Enter a valid email.</span
            >

            <input
              type="password"
              id="shopLoginPassword"
              placeholder="Password"
              required
            />
            <span class="error" id="shopLoginPassError"
              >Password is required.</span
            >

            <button type="submit" class="btn">Login</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2025 LocalLink. All rights reserved.</p>
    </footer>

    <script>
const shopLoginForm=document.getElementById("shopLoginForm");
shopLoginForm.addEventListener("submit",async function(e){e.preventDefault();const email=document.getElementById("shopLoginEmail").value.trim(),password=document.getElementById("shopLoginPassword").value;if(!email.includes("@")||!password){alert("Enter a valid email and password.");return;}try{const r=await fetch("/api/shops/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw Error(d.message);localStorage.setItem("loggedInShop",JSON.stringify(d.shop));alert("Shop login successful!");location.href="shopProfile.html";}catch(e){alert(e.message||"Unable to connect to the server.");}});

fetch(url, {

  .then(({ user }) => { if (!user) location.href = '/login.html'; });
</script>
  </body>
</html>
