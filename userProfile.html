<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>User Profile – LocalLink</title>

    <style>
      :root {
        --brand-dark: #0b2545;
        --brand-mid: #274c77;
        --brand-accent: #fcca46;
        --bg: #f0f4f8;
        --white: #fff;
        --muted: #617d98;
        --radius: 14px;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      body {
        margin: 0;
        background: var(--bg);
        font-family: "Segoe UI", sans-serif;
      }

      header.navbar {
        background: var(--brand-dark);
        padding: 1rem 2rem;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .navbar .logo {
        font-size: 1.5rem;
        font-weight: bold;
      }

      .navbar nav ul {
        list-style: none;
        display: flex;
        gap: 1rem;
        margin: 0;
        padding: 0;
      }

      .navbar nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: 500;
      }

      .profile-hero {
        background: linear-gradient(
          135deg,
          var(--brand-dark),
          var(--brand-mid)
        );
        color: white;
        padding: 4rem 1rem 3rem;
        text-align: center;
      }

      .profile-container {
        max-width: 600px;
        margin: 0 auto;
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid var(--brand-accent);
        object-fit: cover;
        margin-bottom: 1rem;
      }

      .profile-container h2 {
        margin: 0;
        font-size: 1.8rem;
      }

      .profile-container p {
        margin: 0.3rem 0;
        color: #e0e8f9;
      }

      .profile-container button {
        margin-top: 1rem;
        padding: 0.6rem 1rem;
        border: none;
        border-radius: var(--radius);
        background: var(--brand-accent);
        color: var(--brand-dark);
        font-weight: 600;
        cursor: pointer;
      }

      .tabs {
        background: white;
        display: flex;
        justify-content: center;
        gap: 1rem;
        padding: 1rem;
        border-bottom: 1px solid #e6e6e6;
      }

      .tab {
        background: none;
        border: none;
        font-weight: 600;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }

      .tab.active {
        border-bottom: 2px solid var(--brand-dark);
        color: var(--brand-dark);
      }

      .tab-content {
        display: none;
        max-width: 1100px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      .tab-content.active {
        display: block;
      }

      .shop-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.25rem;
      }

      .shop-card {
        background: var(--white);
        border: 1px solid #e2e8f0;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: transform 0.2s;
      }

      .shop-card:hover {
        transform: translateY(-4px);
      }

      .shop-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
      }

      .shop-body {
        padding: 1rem;
      }

      .shop-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--brand-dark);
        margin: 0;
      }

      .shop-location {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .review-card {
        background: white;
        padding: 1rem 1.25rem;
        border: 1px solid #e2e8f0;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 1rem;
      }

      .notification-card {
        background: white;
        padding: 1rem 1.25rem;
        border-left: 4px solid var(--brand-accent);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 1rem;
      }

      .notification-card p {
        margin: 0;
        color: var(--brand-dark);
        font-weight: 500;
      }

      .notification-card span {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .footer {
        text-align: center;
        margin-top: 4rem;
        padding: 1.5rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="logo">LocalLink</div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="explore.html">Explore</a></li>
          <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
      </nav>
    </header>

    <!-- Profile Banner -->
    <section class="profile-hero">
      <div class="profile-container">
        <img class="avatar" src="https://i.pravatar.cc/150?img=32" alt="User" />
        <h2 id="userName">Aarav Sharma</h2>
        <p id="userEmail">aarav@example.com</p>
        <button>Edit Profile</button>
      </div>
    </section>

    <!-- Tabs -->
    <section class="tabs">
      <button class="tab active" data-tab="notifications">Notifications</button>
      <button class="tab" data-tab="followed">Followed Shops</button>
      <button class="tab" data-tab="reviews">My Reviews</button>
    </section>

    <!-- Notifications -->
    <main class="tab-content active" id="notifications">
      <div id="notificationList"></div>
    </main>

    <!-- Followed Shops -->
    <main class="tab-content" id="followed">
      <div class="shop-grid" id="followedShopsGrid"></div>
    </main>

    <!-- My Reviews -->
    <main class="tab-content" id="reviews">
      <div id="reviewSection"></div>
    </main>

    <footer class="footer">
      <p>&copy; 2025 LocalLink. All rights reserved.</p>
    </footer>

    <script>
      const followedShops = [
        {
          name: "Bake House",
          city: "Pune",
          image: "https://picsum.photos/seed/f1/600/400",
        },
        {
          name: "Style Spot",
          city: "Jaipur",
          image: "https://picsum.photos/seed/f2/600/400",
        },
      ];

      const reviews = [
        {
          shop: "Bake House",
          rating: 4,
          comment: "Great cupcakes and very cozy ambiance.",
        },
        {
          shop: "Fresh Mart",
          rating: 5,
          comment: "Affordable and well-stocked! Highly recommend.",
        },
      ];

      const notifications = [
        {
          text: "Fresh Mart has added new offers for Diwali!",
          time: "2 hours ago",
        },
        {
          text: "Your review on Bake House received a reply.",
          time: "1 day ago",
        },
        { text: "Style Spot is now following you!", time: "3 days ago" },
      ];

      // Render notifications
      const notificationList = document.getElementById("notificationList");
      notifications.forEach((n) => {
        const div = document.createElement("div");
        div.className = "notification-card";
        div.innerHTML = `<p>${n.text}</p><span>${n.time}</span>`;
        notificationList.appendChild(div);
      });

      // Render followed shops
      const followedGrid = document.getElementById("followedShopsGrid");
      followedShops.forEach((shop) => {
        const card = document.createElement("div");
        card.className = "shop-card";
        card.innerHTML = `
        <img src="${shop.image}" alt="${shop.name}">
        <div class="shop-body">
          <p class="shop-title">${shop.name}</p>
          <p class="shop-location">${shop.city}</p>
        </div>`;
        followedGrid.appendChild(card);
      });

      // Render reviews
      const reviewSection = document.getElementById("reviewSection");
      reviews.forEach((r) => {
        const div = document.createElement("div");
        div.className = "review-card";
        div.innerHTML = `
        <h4>${r.shop}</h4>
        <div class="rating">⭐ ${r.rating} / 5</div>
        <p>${r.comment}</p>`;
        reviewSection.appendChild(div);
      });

      // Tab switching logic
      const tabs = document.querySelectorAll(".tab");
      const contents = document.querySelectorAll(".tab-content");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));
          contents.forEach((c) => c.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(tab.dataset.tab).classList.add("active");
        });
      });

      // Logout action
      document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault(); // prevent default link navigation

        // Clear relevant localStorage/sessionStorage data
        localStorage.removeItem("users"); // replace with actual key you use
        localStorage.removeItem("loggedInUser");
        sessionStorage.clear(); // optional: clear session storage too

        // Redirect to login page
        window.location.href = "/login.html";
      });

    </script>
  </body>
</html>
