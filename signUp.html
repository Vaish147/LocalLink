<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalLink - Sign Up</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Reusing styles from login.html */
      body {
        background: #f0f4f8;
        font-family: "Segoe UI", sans-serif;
      }
      .auth-page {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      .auth-wrapper {
        width: 100%;
        max-width: 1000px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        border-radius: 16px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1fr;
        animation: fadeIn 0.4s ease;
      }
      .auth-illustration {
        background: #e9eff5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .auth-illustration img {
        width: 100%;
        height: 100%;
        max-height: 520px;
        object-fit: cover;
        border-radius: 12px;
      }
      .auth-form {
        padding: 2rem 2.25rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .auth-form h2 {
        margin-bottom: 0.5rem;
        color: #0b2545;
      }
      .auth-form p {
        color: #617d98;
        margin-bottom: 1.5rem;
      }
      .auth-form input {
        width: 100%;
        padding: 0.8rem 1rem;
        margin-bottom: 0.85rem;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #f9fafb;
        font-size: 1rem;
        transition: 0.25s;
      }
      .auth-form input:focus {
        border-color: #0b2545;
        background: #fff;
        outline: none;
      }
      .auth-form .btn {
        width: 100%;
        padding: 0.9rem;
        background: #fcca46;
        color: #0b2545;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.25s;
        margin-top: 0.25rem;
      }
      .auth-form .btn:hover {
        background: #ffb703;
      }
      .extra-links {
        margin-top: 1rem;
        font-size: 0.9rem;
        text-align: center;
      }
      .extra-links a {
        color: #0b2545;
        font-weight: 600;
        text-decoration: none;
      }
      .error {
        display: none;
        color: red;
        font-size: 0.85rem;
        margin: -0.4rem 0 0.6rem;
        text-align: left;
      }
      @media (max-width: 820px) {
        .auth-wrapper {
          grid-template-columns: 1fr;
        }
        .auth-illustration {
          display: none;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="container">
        <h1 class="logo">LocalLink</h1>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="explore.html">Explore</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html" class="active">Sign Up</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-wrapper">
        <div class="auth-illustration">
          <!-- Replace with your own illustration -->
          <img
            src="https://plus.unsplash.com/premium_vector-1720534517470-8815da9e3998?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Signup Illustration"
          />
        </div>

        <div class="auth-form">
          <h2>Create Your Account</h2>
          <p>Join LocalLink and support your neighborhood</p>
          <form id="signupForm">
            <input
              type="text"
              id="signupName"
              placeholder="Full Name"
              required
            />
            <span class="error" id="nameError">Name is required.</span>

            <input type="email" id="signupEmail" placeholder="Email" required />
            <span class="error" id="signupEmailError"
              >Enter a valid email.</span
            >

            <input
              type="password"
              id="signupPassword"
              placeholder="Password (min 6 characters)"
              required
            />
            <span class="error" id="signupPassError"
              >Password must be at least 6 characters.</span
            >

            <button type="submit" class="btn">Sign Up</button>

            <div class="extra-links">
              <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2025 LocalLink. All rights reserved.</p>
    </footer>

    <script>
const signupForm = document.getElementById("signupForm");
signupForm.addEventListener("submit", async function(e){
 e.preventDefault();
 const name=document.getElementById("signupName").value.trim(), email=document.getElementById("signupEmail").value.trim(), password=document.getElementById("signupPassword").value;
 if(!name||!email.includes("@")||password.length<6){alert("Please enter a valid name, email and password (minimum 6 characters).");return;}
 try{const r=await fetch("/api/auth/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,password})});const d=await r.json();if(!r.ok)throw Error(d.message);alert("Sign up successful! Redirecting to login...");location.href="login.html";}catch(e){alert(e.message||"Unable to connect to the server.");}
});

</script>
  </body>
</html>
